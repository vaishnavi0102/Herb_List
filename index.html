<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HerbList</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&family=Roboto:wght@300;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet"/>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background-size: 100%;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 30px;
      position: absolute;
      top: 100px;
      left: 50px;
    }

    .nav a, .extra-buttons a {
      text-decoration: none;
      color: black;
      font-size: 20px;
      font-family: 'Montserrat', sans-serif;
      padding: 20px 40px;
      border: 3px solid black;
      border-radius: 20px;
      background: transparent;
      transition: all 0.3s ease;
    }

    .nav a:hover, .extra-buttons a:hover {
      background: rgba(0, 0, 0, 0.1);
      transform: scale(1.2);
    }

    .title-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 50px;
    }

    .above-title {
      font-size: 50px;
      font-weight: 700;
      color: black;
      font-family: 'Montserrat', sans-serif;
      margin-top: 40px;
      margin-bottom: -20px;
    }

    .main-title {
      font-size: 140px;
      font-weight: 700;
      color: black;
      text-shadow: 3px 3px 15px rgba(0, 0, 0, 0.3);
      font-family: 'Montserrat', sans-serif;
      margin-top: 0;
    }

    .sub-title {
      font-size: 50px;
      font-weight: 700;
      color: black;
      font-family: 'Montserrat', sans-serif;
      position: absolute;
      top: 20px;
      left: 50px;
    }

    .quote {
      font-size: 24px;
      color: black;
      font-style: italic;
      margin-top: 0px;
    }

    .plant-of-the-day {
      padding: 40px;
      text-align: left;
      background-color: rgba(255, 255, 255, 0.8);
      margin: 40px auto;
      width: 80%;
      border-radius: 20px;
      margin-top: 11cm;
      font-size: large;
    }
  </style>
</head>
<body>

  <div class="sub-title">HerbList</div>
  <div class="nav">
    <a href="plants.html">Plants</a>
    <a href="tips.html">Tips</a>
    <a href="symptoms.html">Symptoms</a>
    <a href="mood.html">Mood</a>
    <a href="about.html">About</a>
  </div>

  <div class="title-container">
    <div class="above-title">MEDICINAL</div>
    <div class="main-title">PLANTS</div>
  </div>

  <div class="quote">"Nature itself is the best physician." — Hippocrates</div>

  <!-- Plant of the Day Section -->
  <section class="plant-of-the-day" id="plant-of-the-day"></section>

  <script>
    const plants = [
      {
        name: "Aloe Vera",
        botanical: "Aloe barbadensis miller",
        benefits: "Known for its soothing properties, Aloe Vera helps in healing skin wounds, burns, and sunburns. It also aids digestion and supports immune function.",
        usage: "Apply directly to skin or take as juice/supplement."
      },
      {
        name: "Basil",
        botanical: "Ocimum basilicum",
        benefits: "Basil has anti-inflammatory and antibacterial properties. It helps treat digestive issues and relieve stress.",
        usage: "Use fresh leaves in tea or cooking, or as an essential oil."
      },
      {
        name: "Neem",
        botanical: "Azadirachta indica",
        benefits: "Neem is a powerful antimicrobial herb used to treat skin conditions, improve dental health, and support detoxification.",
        usage: "Use as paste for skin, or as tea or oil."
      },
      {
        name: "Lavender",
        botanical: "Lavandula angustifolia",
        benefits: "Lavender is calming and helps reduce anxiety, promote sleep, and soothe skin.",
        usage: "Use in aromatherapy, teas, or essential oil blends."
      },
      {
        name: "Ginger",
        botanical: "Zingiber officinale",
        benefits: "Relieves nausea, promotes digestion, reduces inflammation, and boosts immunity.",
        usage: "Use fresh, in teas, or as a supplement."
      },
      {
        name: "Turmeric",
        botanical: "Curcuma longa",
        benefits: "Contains curcumin, a powerful anti-inflammatory and antioxidant; helps with joint pain and skin health.",
        usage: "Use in golden milk, cooking, or as capsules."
      },
      {
        name: "Chamomile",
        botanical: "Matricaria chamomilla",
        benefits: "Calms nerves, aids sleep, and eases digestion.",
        usage: "Enjoy as a calming tea before bed."
      }
    ];

    const index = new Date().getDate() % plants.length;
    const plant = plants[index];

    document.getElementById("plant-of-the-day").innerHTML = `
      <h2>🌿 Plant of the Day 🌿</h2>
      <h3>${plant.name}</h3>
      <p><strong>Botanical Name:</strong> ${plant.botanical}</p>
      <p><strong>Benefits:</strong> ${plant.benefits}</p>
      <p><strong>Usage:</strong> ${plant.usage}</p>
    `;
  </script>

</body>
</html>
