<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Plant Helper | Select Symptoms</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom right, #e8f5e9, #f1f8e9);
      padding: 30px;
      text-align: center;
      color: #333;
    }

    h1 {
      color: #2e7d32;
      font-size: 36px;
    }

    form {
      max-width: 700px;
      margin: auto;
      text-align: left;
    }

    .section {
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 5px 0;
      font-size: 16px;
    }

    button {
      padding: 12px 25px;
      background-color: #75d184;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #fefefe;
    }
  </style>
</head>
<body>

  <h1>🌿 Find the Right Plant</h1>
  <p>Select your symptoms and any plants you're allergic to. Then view helpful herbs on the next page.</p>

  <form action="results.html" method="GET">
    <div class="section">
      <h3>Symptoms / Conditions:</h3>
      <label><input type="checkbox" name="symptom" value="cold"> Cold</label>
      <label><input type="checkbox" name="symptom" value="cough"> Cough</label>
      <label><input type="checkbox" name="symptom" value="headache"> Headache</label>
      <label><input type="checkbox" name="symptom" value="stress"> Stress</label>
      <label><input type="checkbox" name="symptom" value="insomnia"> Insomnia</label>
      <label><input type="checkbox" name="symptom" value="nausea"> Nausea</label>
      <label><input type="checkbox" name="symptom" value="bloating"> Bloating</label>
      <label><input type="checkbox" name="symptom" value="sore-throat"> Sore Throat</label>
      <label><input type="checkbox" name="symptom" value="menstrual"> Menstrual Cramps</label>
      <label><input type="checkbox" name="symptom" value="dry-skin"> Dry Skin</label>
      <label><input type="checkbox" name="symptom" value="fever"> Mild Fever</label>
    </div>

    <div class="section">
      <h3>Allergic to these plants?</h3>
      <label><input type="checkbox" name="allergy" value="Peppermint"> Peppermint</label>
      <label><input type="checkbox" name="allergy" value="Chamomile"> Chamomile</label>
      <label><input type="checkbox" name="allergy" value="Neem"> Neem</label>
      <label><input type="checkbox" name="allergy" value="Tulsi"> Tulsi (Holy Basil)</label>
      <label><input type="checkbox" name="allergy" value="Lavender"> Lavender</label>
      <label><input type="checkbox" name="allergy" value="Ginger"> Ginger</label>
      <label><input type="checkbox" name="allergy" value="Turmeric"> Turmeric</label>
      <label><input type="checkbox" name="allergy" value="Fenugreek"> Fenugreek</label>
    </div>

    <div style="text-align: center;">
      <button type="submit">View Plant Suggestions</button>
    </div>
  </form>

</body>
</html>
